<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CSS Injector — Settings</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0e0e11;
      --surface:  #17171c;
      --surface2: #1f1f27;
      --border:   #2a2a35;
      --accent:   #7b6cff;
      --accent2:  #00e5c0;
      --danger:   #ff5f5f;
      --text:     #e8e6f0;
      --muted:    #666680;
      --mono:     'JetBrains Mono', monospace;
      --display:  'Syne', sans-serif;
    }

    html { background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 14px; }

    body { max-width: 860px; margin: 0 auto; padding: 40px 24px 80px; }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 12px;
      display: grid; place-items: center;
      font-size: 20px;
      font-family: var(--mono);
      font-weight: 600;
      color: white;
      flex-shrink: 0;
    }

    h1 {
      font-family: var(--display);
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* ── Section title ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title {
      font-family: var(--display);
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .1em;
    }

    .count-badge {
      font-size: 11px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 10px;
      color: var(--muted);
    }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    .empty-icon { font-size: 36px; margin-bottom: 12px; }
    .empty p { font-size: 13px; line-height: 1.7; }

    /* ── Domain cards ── */
    #domain-list { display: flex; flex-direction: column; gap: 12px; }

    .domain-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color .2s;
    }

    .domain-card:focus-within { border-color: var(--accent); }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      gap: 10px;
    }

    .card-header:hover { background: #232330; }

    .domain-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }

    .domain-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent2);
      flex-shrink: 0;
    }

    .domain-dot.off { background: var(--muted); }

    .domain-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-meta { font-size: 11px; color: var(--muted); white-space: nowrap; }

    .card-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .btn-icon {
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-family: var(--mono);
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: all .15s;
    }

    .btn-icon:active { transform: scale(.95); }

    .btn-delete {
      background: transparent;
      color: var(--danger);
      border-color: transparent;
    }
    .btn-delete:hover { background: rgba(255,95,95,.1); border-color: var(--danger); }

    .btn-save-card {
      background: var(--accent);
      color: white;
      border-color: transparent;
    }
    .btn-save-card:hover { opacity: .85; }

    /* ── Collapsible editor ── */
    .card-body {
      display: none;
      padding: 0;
    }
    .card-body.open { display: block; }

    .card-body textarea {
      width: 100%;
      height: 180px;
      background: var(--surface);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.7;
      border: none;
      outline: none;
      resize: vertical;
      padding: 14px 16px;
      tab-size: 2;
      caret-color: var(--accent2);
    }

    .chevron {
      font-size: 10px;
      color: var(--muted);
      transition: transform .2s;
      flex-shrink: 0;
    }
    .chevron.open { transform: rotate(180deg); }

    /* ── Clear all button ── */
    .danger-zone {
      margin-top: 48px;
      padding: 20px;
      border: 1px solid #3a1f1f;
      border-radius: 10px;
      background: rgba(255,95,95,.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .danger-label { font-size: 13px; color: var(--muted); }
    .danger-label strong { color: var(--danger); display: block; margin-bottom: 3px; }

    #btn-clear-all {
      padding: 9px 18px;
      background: transparent;
      border: 1px solid var(--danger);
      border-radius: 7px;
      color: var(--danger);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
      flex-shrink: 0;
    }
    #btn-clear-all:hover { background: rgba(255,95,95,.1); }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      padding: 8px 20px;
      border-radius: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      font-family: var(--mono);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { background: var(--danger); }
  </style>
</head>
<body>

<header>
  <div class="logo">{ }</div>
  <div>
    <h1>CSS Injector</h1>
    <p class="subtitle">Manage your saved styles across all domains</p>
  </div>
</header>

<div class="section-header">
  <span class="section-title">Saved Domains</span>
  <span class="count-badge" id="count-badge">0 domains</span>
</div>

<div id="domain-list"></div>

<div class="danger-zone">
  <div class="danger-label">
    <strong>Danger Zone</strong>
    Delete all saved styles for every domain at once.
  </div>
  <button id="btn-clear-all">🗑 Clear All</button>
</div>

<div id="toast"></div>

<script src="settings.js"></script>
</body>
</html>
